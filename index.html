<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>THEE RYDER</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Thee Ryder — fashion photographer and visual artist. Based in Bratislava, available worldwide." />
<style>
  :root{
    --cobalt:#25408f;
    --ink:#1e1e1e;
    --gray:#c4c4c4;
    --white:#ffffff;
    --pad: clamp(20px, 4.3vw, 62px);
    --nav-h: 90px;
    --ease: cubic-bezier(.7,0,.2,1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  html{ background:var(--cobalt); scroll-behavior:smooth; }
  body{
    font-family: Arial, Helvetica, sans-serif;
    background:var(--cobalt);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{ color:inherit; text-decoration:none; }
  img{ display:block; width:100%; height:100%; object-fit:cover; }

  /* hide native cursor on fine pointers (custom cursor takes over) */
  @media (hover:hover) and (pointer:fine){
    *{ cursor:none !important; }
  }

  /* ───────── custom cursor ───────── */
  #cursor{
    position:fixed; top:0; left:0; z-index:9999; pointer-events:none;
    width:14px; height:14px; border-radius:50%;
    border:1px solid var(--white);
    transform:translate(-50%,-50%);
    transition: width .25s var(--ease), height .25s var(--ease),
                background .25s var(--ease), border-color .25s var(--ease),
                opacity .3s ease;
    mix-blend-mode:difference;
  }
  #cursor.dark{ border-color:var(--ink); }
  #cursor.link{ width:42px; height:42px; background:transparent; }
  #cursor.hide{ opacity:0; }
  #cursor-label{
    position:fixed; top:0; left:0; z-index:9999; pointer-events:none;
    transform:translate(18px,8px);
    font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--white); mix-blend-mode:difference; white-space:nowrap;
    opacity:0; transition:opacity .25s ease;
  }
  #cursor-label.show{ opacity:1; }
  @media (hover:none),(pointer:coarse){ #cursor,#cursor-label{ display:none; } }

  /* floating preview tile in the work menu */
  #preview{
    position:fixed; top:0; left:0; z-index:9000; pointer-events:none;
    width:min(30vw,360px); aspect-ratio:3/4; overflow:hidden;
    transform:translate(-50%,-50%) scale(.96);
    opacity:0; transition:opacity .35s var(--ease), transform .35s var(--ease);
    background:var(--gray);
  }
  #preview.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ───────── navigation ───────── */
  nav{
    position:fixed; top:0; left:0; width:100%; height:var(--nav-h); z-index:500;
    display:flex; align-items:center; justify-content:center; gap:clamp(28px,5vw,90px);
    padding:0 var(--pad);
  }
  nav a{
    font-size:20px; color:var(--white); letter-spacing:.04em;
    position:relative; padding:6px 2px;
  }
  nav a::after{
    content:""; position:absolute; left:0; bottom:0; width:100%; height:1px;
    background:currentColor; transform:scaleX(0); transform-origin:left;
    transition:transform .4s var(--ease);
  }
  nav a:hover::after, nav a.active::after{ transform:scaleX(1); }
  .page-label{
    position:fixed; top:26px; left:var(--pad); z-index:500;
    font-size:20px; color:var(--ink); text-transform:lowercase; letter-spacing:.02em;
    opacity:0; transition:opacity .5s ease;
  }
  .page-label.show{ opacity:.85; }

  /* ───────── view container & transitions ───────── */
  #view{ position:relative; min-height:100vh; }
  .screen{ animation: screenIn .55s var(--ease) both; }
  @keyframes screenIn{ from{ transform:translateY(16px); } to{ transform:none; } }

  /* ───────── HOME ───────── */
  .home{ position:relative; min-height:100vh; }
  .home-hero{
    position:fixed; inset:0; z-index:0;
    background:#0b0b0d center/cover no-repeat;
  }
  .home-hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,.55)); }
  .home-welcome{
    position:absolute; left:var(--pad); right:var(--pad); bottom:clamp(40px,7vh,90px);
    z-index:2;
    color:var(--gray);
    font-size:clamp(34px,5.4vw,76px);
    line-height:1.02;
    letter-spacing:.5em;
    text-align:justify;
    text-transform:uppercase;
    text-wrap:balance;
  }
  .home-welcome > span{ display:inline-block; }
  /* push the justify so the last line also spreads */
  .home-welcome::after{ content:""; display:inline-block; width:100%; }

  /* ───────── WORK MENU ───────── */
  .work{
    min-height:100vh; padding:calc(var(--nav-h) + 8vh) var(--pad) 12vh;
    display:flex; flex-direction:column;
    justify-content:center;
    justify-content:safe center;  /* centers when it fits, top-aligns + scrolls when tall */
  }
  .work-list{ display:flex; flex-direction:column; gap:clamp(4px,1vh,12px); max-width:1100px; }
  .work-row{
    display:flex; align-items:baseline; gap:clamp(16px,2.4vw,40px);
    color:#1b327a; /* slightly-darker-than-bg, like the figma */
    transition:color .35s var(--ease), transform .35s var(--ease), opacity .35s var(--ease);
    text-transform:uppercase;
  }
  .work-row .wno{ font-size:clamp(22px,2.6vw,40px); letter-spacing:.2em; flex:none; width:2.4em; }
  .work-row .wtitle{ font-size:clamp(24px,3.2vw,48px); letter-spacing:.22em; }
  .work-row.empty{ }
  @media (hover:hover){
    .work-list:hover .work-row{ opacity:.45; }
    .work-list:hover .work-row:hover{ opacity:1; color:var(--white); transform:translateX(18px); }
  }
  .work-row .tag{
    font-size:11px; letter-spacing:2px; align-self:center; margin-left:14px;
    color:var(--gray); opacity:0; transition:opacity .3s; text-transform:uppercase;
  }
  .work-row:hover .tag{ opacity:.8; }

  /* ───────── PROJECT ───────── */
  .project{ padding:calc(var(--nav-h) + 6vh) var(--pad) 0; }
  .project-head{ max-width:1320px; margin:0 auto; }
  .project-title{
    color:var(--ink); font-size:clamp(52px,11vw,128px); line-height:1;
    letter-spacing:.18em; text-transform:uppercase; word-break:break-word;
  }
  .project-blurb{
    color:var(--ink); font-size:clamp(16px,1.55vw,24px); line-height:1.18;
    letter-spacing:.06em; text-align:justify; max-width:1320px; margin:clamp(22px,3vh,40px) auto 0;
  }
  .project-gallery{
    max-width:1320px; margin:clamp(40px,7vh,90px) auto 0;
    display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(14px,2vw,30px);
  }
  .project-gallery .cell{ overflow:hidden; background:var(--gray); }
  .project-gallery .cell.full{ grid-column:1 / -1; }
  .project-gallery .cell img{ width:100%; height:auto; display:block; transition:transform 1.4s var(--ease); }
  .project-gallery .cell:hover img{ transform:scale(1.03); }
  .project-gallery .cell.placeholder{ aspect-ratio:3/4; display:flex; align-items:center; justify-content:center; }
  .project-gallery .cell.placeholder.full{ aspect-ratio:16/9; }
  .placeholder-note{ color:#1b327a; font-size:13px; letter-spacing:2px; text-transform:uppercase; }
  .project-empty{ max-width:1320px; margin:8vh auto; color:var(--ink); font-size:clamp(18px,2vw,28px); letter-spacing:.1em; text-transform:uppercase; opacity:.7; }
  .project-credits{
    max-width:1320px; margin:clamp(40px,7vh,90px) auto 0;
    color:var(--ink); font-size:clamp(15px,1.4vw,22px); line-height:1.5; letter-spacing:.08em;
  }
  .project-credits .ttl{ color:var(--gray); text-transform:uppercase; letter-spacing:.18em; font-size:.8em; margin-bottom:10px; }
  .project-nav{
    max-width:1320px; margin:clamp(50px,8vh,110px) auto 0;
    display:flex; justify-content:space-between; align-items:center; gap:20px;
    padding:40px 0 70px; color:var(--ink);
    font-size:clamp(18px,2.4vw,36px); letter-spacing:.02em;
  }
  .project-nav span:hover{ color:var(--white); }

  /* ───────── INFO ───────── */
  .info{ padding:calc(var(--nav-h) + 6vh) var(--pad) 12vh; max-width:1320px; margin:0 auto; }
  .info-bio{
    color:var(--ink); font-size:clamp(20px,2.6vw,32px); line-height:1.18; letter-spacing:.08em;
    text-align:justify;
  }
  .info-cols{ display:grid; grid-template-columns:1.2fr 1fr; gap:clamp(30px,5vw,70px); margin-top:clamp(40px,7vh,90px); }
  @media (max-width:820px){ .info-cols{ grid-template-columns:1fr; } }
  .info-h{ color:var(--gray); font-size:clamp(20px,2.2vw,32px); letter-spacing:.1em; text-transform:uppercase; margin-bottom:18px; }
  .info-block + .info-block{ margin-top:clamp(36px,6vh,64px); }
  .info-item{ color:var(--ink); font-size:clamp(15px,1.5vw,22px); line-height:1.32; letter-spacing:.05em; padding:7px 0; border-top:1px solid rgba(30,30,30,.16); }

  /* ───────── CONTACT ───────── */
  .contact{ min-height:100vh; padding:calc(var(--nav-h) + 6vh) var(--pad) 10vh; display:flex; align-items:center; }
  .contact-inner{ max-width:1320px; margin:0 auto; width:100%; }
  .contact-line{
    color:var(--ink); font-size:clamp(26px,4.6vw,58px); line-height:1.22; letter-spacing:.34em;
    text-transform:uppercase; text-align:justify;
    overflow-wrap:break-word; word-break:break-word;
  }
  .contact-line a{ border-bottom:2px solid var(--ink); overflow-wrap:anywhere; }
  .contact-line a:hover{ color:var(--white); border-color:var(--white); }

  /* ───────── LOADING ───────── */
  #loader{
    position:fixed; inset:0; z-index:10000; background:var(--cobalt);
    display:flex; align-items:center; justify-content:center; padding:0 var(--pad);
    transition:opacity .9s var(--ease), visibility .9s;
  }
  #loader.done{ opacity:0; visibility:hidden; }
  #loader p{
    color:var(--white); font-size:clamp(20px,3vw,36px); letter-spacing:.35em;
    text-transform:uppercase; text-align:justify; width:100%; max-width:1315px; line-height:1.1;
  }
  #loader .lt{ opacity:0; transition:opacity .5s ease; }
  #loader .lt.on{ opacity:1; }

  /* footer mark */
  .foot{ position:fixed; bottom:18px; right:var(--pad); z-index:400; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--white); opacity:.55; }
  @media (max-width:600px){ .foot{ display:none; } }

  /* ═══════════ TABLET (≤900px) ═══════════ */
  @media (max-width:900px){
    :root{ --nav-h:74px; }
    nav{ gap:clamp(18px,4vw,40px); }
    nav a{ font-size:17px; }
    .page-label{ font-size:16px; top:22px; }
    .home-welcome{ letter-spacing:.34em; }
    .contact-line{ letter-spacing:.22em; }
  }

  /* ═══════════ PHONE (≤620px) ═══════════ */
  @media (max-width:620px){
    :root{ --nav-h:62px; }

    /* nav: keep all four words, tighten and pin to top edge */
    nav{
      justify-content:space-between; gap:6px;
      height:var(--nav-h); padding:0 16px;
    }
    nav a{ font-size:14px; letter-spacing:.01em; padding:6px 0; }
    .page-label{ display:none; }          /* avoid clashing with the tight nav */
    .foot{ display:none; }

    /* HOME — big & justified but contained, sit a touch higher */
    .home-welcome{
      font-size:clamp(30px,11vw,52px);
      letter-spacing:.18em;
      line-height:1.06;
      bottom:clamp(28px,6vh,60px);
    }

    /* WORK menu — left aligned, comfortable tap targets */
    .work{ padding:calc(var(--nav-h) + 5vh) 16px 12vh; justify-content:flex-start; }
    .work-list{ gap:10px; }
    .work-row{ gap:14px; align-items:baseline; }
    .work-row .wno{ font-size:18px; width:2.2em; letter-spacing:.12em; }
    .work-row .wtitle{ font-size:26px; letter-spacing:.12em; }
    .work-row .tag{ display:none; }
    /* on touch there is no hover-dim; show every row at full strength */
    .work-list .work-row{ opacity:1 !important; color:#cdd6ef; transform:none !important; }

    /* PROJECT — single column gallery, full-bleed-ish */
    .project{ padding:calc(var(--nav-h) + 4vh) 16px 0; }
    .project-title{ font-size:clamp(40px,15vw,72px); letter-spacing:.08em; }
    .project-blurb{ font-size:16px; letter-spacing:.03em; text-align:left; }
    .project-gallery{ grid-template-columns:1fr; gap:12px; margin-top:7vh; }
    .project-gallery .cell.full,
    .project-gallery .cell{ grid-column:1 / -1; }
    .project-credits{ font-size:15px; }
    .project-nav{ font-size:18px; padding:30px 0 56px; }

    /* INFO */
    .info{ padding:calc(var(--nav-h) + 4vh) 16px 14vh; }
    .info-bio{ font-size:20px; letter-spacing:.04em; text-align:left; }
    .info-cols{ margin-top:7vh; }
    .info-h{ font-size:20px; }
    .info-item{ font-size:15px; }

    /* CONTACT */
    .contact{ padding:calc(var(--nav-h) + 5vh) 16px 12vh; align-items:flex-start; }
    .contact-line{ font-size:clamp(24px,8vw,38px); letter-spacing:.12em; text-align:left; }

    /* LOADING */
    #loader{ padding:0 16px; }
    #loader p{ font-size:clamp(18px,6vw,30px); letter-spacing:.18em; text-align:left; }
  }

  /* very small phones */
  @media (max-width:380px){
    nav a{ font-size:13px; }
    .work-row .wtitle{ font-size:22px; }
  }

  /* reduce motion */
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
  <div id="loader"><p id="loader-text"></p></div>

  <nav id="nav">
    <a data-route="home">home</a>
    <a data-route="work">work</a>
    <a data-route="info">info</a>
    <a data-route="contact">contact</a>
  </nav>
  <div class="page-label" id="page-label"></div>

  <main id="view"></main>

  <div class="foot">© thee ryder — 2026</div>

  <div id="preview"></div>
  <div id="cursor"></div>
  <div id="cursor-label"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#25408f"/>
      <text x="50" y="46" font-family="Arial" font-size="13" letter-spacing="2"
        fill="#ffffff" text-anchor="middle">THEE</text>
      <text x="50" y="64" font-family="Arial" font-size="13" letter-spacing="2"
        fill="#c4c4c4" text-anchor="middle">RYDER</text>
    </svg>
  </template>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
